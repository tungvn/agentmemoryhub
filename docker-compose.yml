services:
  agentmemory:
    image: agentmemoryhub:latest
    build:
      context: .
      args:
        AGENTMEMORY_VERSION: "0.9.21"
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    restart: unless-stopped
    ports:
      - "3111:3111"
      - "3112:3112"
      - "3113:3113"
    env_file:
      - .env
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  agentmemory-data:
